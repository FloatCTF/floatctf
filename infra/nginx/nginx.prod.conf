# FloatCTF production nginx config (Phase 10.5).
# Deployed to ${FLOATCTF_HOME}/config/nginx/nginx.conf by scripts/deploy.sh.
#
# 网络边界（设计定稿）：nginx 容器以 network_mode: host 运行，与宿主共享网络
# 命名空间；API 是原生 systemd 进程，RustFS 容器仅回环发布 —— 二者均从
# 127.0.0.1 直连。无 host.docker.internal / Docker 内嵌 DNS 依赖。
#
# 端口：HTTP_PORT（默认 80）；HTTPS 结构预留（keys/ 由运维提供证书）。

user nginx;
worker_processes auto;
worker_rlimit_nofile 100000;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    charset utf-8;

    # 静态 upstream：API 原生进程在宿主回环（network_mode: host 下 127.0.0.1 即宿主）。
    upstream api_backend {
        server 127.0.0.1:${API_PORT};
        keepalive 64;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      "";
    }

    log_format main
        '$remote_addr - $remote_user [$time_local] '
        '"$request" $status $body_bytes_sent '
        '"$http_referer" "$http_user_agent" '
        'upstream="$upstream_addr" '
        'request_time=$request_time '
        'upstream_time=$upstream_response_time';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log info;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    keepalive_timeout 65s;
    keepalive_requests 10000;

    reset_timedout_connection on;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;

    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/wasm
        image/svg+xml;

    server {
        listen ${HTTP_PORT};
        listen [::]:${HTTP_PORT};

        server_name _;

        client_max_body_size 0;
        client_body_buffer_size 1m;

        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        # SSE：长驻连接必须关闭缓冲；300s 空闲由前端 fetch-SSE 心跳+重连兜底
        #（Phase 9.2 A1 已证断线自愈），这里只保证不提前掐断。
        proxy_read_timeout 300s;

        proxy_buffering off;
        proxy_request_buffering off;

        # API（含 SSE /api/**/awd/stream 与 WS）
        location ^~ /api/ {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;

            proxy_cache_bypass $http_upgrade;
        }

        # RustFS 公共桶
        # /public/a.png -> /floatctf-public/a.png（RustFS 容器回环 127.0.0.1:9000）
        location ^~ /public/ {
            rewrite ^/public/(.*)$ /floatctf-public/$1 break;
            proxy_pass http://127.0.0.1:${RUSTFS_PORT};

            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;

            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # RustFS 私有桶（SigV4 验签 host 必须与 API 生成 presigned URL 时一致）
        # /private/<key>?X-Amz-... -> /floatctf-private/<key>?X-Amz-...  Host: 127.0.0.1:9000
        location ^~ /private/ {
            rewrite ^/private/(.*)$ /floatctf-private/$1 break;
            proxy_pass http://127.0.0.1:${RUSTFS_PORT};

            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host 127.0.0.1:${RUSTFS_PORT};

            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 挑战附件下载（挂载 ${FLOATCTF_HOME}/runtime/challenges → /app/api/challenges）
        location ~ ^/static/challenges/([^/]+)/attachment/(.+)$ {
            alias /app/api/challenges/$1/attachment/$2;
            try_files $uri =404;
            add_header X-Content-Type-Options nosniff always;
            add_header Content-Disposition 'attachment' always;
        }

        # 前端静态资产（${FLOATCTF_HOME}/web 挂载到 /usr/share/nginx/html）
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }

    # TLS 结构预留：证书放入 ${FLOATCTF_HOME}/config/nginx/keys/ 后启用本块。
    # server {
    #     listen ${HTTPS_PORT} ssl;
    #     listen [::]:${HTTPS_PORT} ssl;
    #     server_name _;
    #
    #     ssl_certificate     /etc/nginx/keys/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/keys/privkey.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ... 同 80 server 的 location 配置 ...
    # }
}
