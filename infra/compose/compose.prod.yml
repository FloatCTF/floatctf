# FloatCTF production infrastructure compose (Phase 10.5).
# Deployed to /home/floatctf/compose.yml by scripts/deploy.sh.
#
# 网络边界（设计定稿）：
#   - postgres / rustfs：仅回环发布（127.0.0.1:<port>），绝不 0.0.0.0
#   - nginx：network_mode: host —— 与宿主共享网络命名空间，直接 listen 80/443，
#     经 127.0.0.1 反代到原生 API 进程与 rustfs 容器（见 infra/nginx/nginx.prod.conf）
#   - API：原生 systemd 进程（floatctf-api.service），不在此编排
#
# 就绪语义：全部服务带 healthcheck；deploy.sh 与 floatctf-infra.service 用
# `docker compose up -d --wait` 等待 healthcheck 通过才算 infra ready。

name: floatctf

services:
    postgres:
        image: postgres:17
        container_name: floatctf-postgres
        restart: unless-stopped
        ports:
            - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-postgres}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 必须在 .env 设置}
            POSTGRES_DB: ${POSTGRES_DB:-floatctf_db}
        volumes:
            - /home/floatctf/data/postgres:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-floatctf_db}"]
            interval: 5s
            timeout: 3s
            retries: 10
            start_period: 10s
        # 禁止：公开端口、自动 initdb 迁移（生产迁移由 deploy.sh 显式执行）

    rustfs:
        image: rustfs/rustfs:latest
        container_name: floatctf-rustfs
        restart: unless-stopped
        user: "10001:10001"   # rustfs 镜像内置用户 uid/gid 10001（OverlayFS 下避免宿主导入）
        ports:
            - "127.0.0.1:${RUSTFS_PORT:-9000}:9000"
            - "127.0.0.1:${RUSTFS_CONSOLE_PORT:-9001}:9001"
        volumes:
            - /home/floatctf/data/rustfs:/data
            - /home/floatctf/logs/rustfs:/logs
        environment:
            RUSTFS_ADDRESS: ":9000"
            RUSTFS_SERVER_DOMAINS: example.com
            RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?RUSTFS_ACCESS_KEY 必须在 .env 设置}
            RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?RUSTFS_SECRET_KEY 必须在 .env 设置}
            RUSTFS_CONSOLE_ENABLE: "true"
            RUSTFS_OBS_LOG_DIRECTORY: /logs
        healthcheck:
            # RustFS 无官方 healthcheck 命令；镜像自带 nc（busybox），用 TCP 探测 9000。
            test: ["CMD-SHELL", "nc -z 127.0.0.1 9000 || exit 1"]
            interval: 5s
            timeout: 3s
            retries: 10
            start_period: 10s

    nginx:
        image: nginx:1.26-bookworm
        container_name: floatctf-nginx
        restart: unless-stopped
        # host 网络：nginx 是唯一对外暴露面，直接由宿主 nftables 管辖。
        network_mode: host
        volumes:
            - /home/floatctf/config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
            - /home/floatctf/web:/usr/share/nginx/html:ro
            # 挑战附件静态下载（WORK_DIR=/home/floatctf/runtime → challenges 在其下）
            - /home/floatctf/runtime/challenges:/app/api/challenges:ro
            - /home/floatctf/logs/nginx:/var/log/nginx
        # TLS 结构预留：证书由运维放入 /home/floatctf/config/nginx/keys/
        #   - /home/floatctf/config/nginx/keys:/etc/nginx/keys:ro
        depends_on:
            postgres:
                condition: service_healthy
            rustfs:
                condition: service_healthy
        healthcheck:
            test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:${HTTP_PORT:-80}/ >/dev/null || exit 1"]
            interval: 10s
            timeout: 3s
            retries: 10
            start_period: 5s
