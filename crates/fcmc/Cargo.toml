[package]
name = "fcmc"
version = "1.2.0"
edition.workspace = true
description = "A CLI tool to check whether CTF challenge meta.toml configs are valid, and optionally test Docker setup"
license = "MIT"
repository = "https://github.com/FloatCTF/fcmc"
readme = "README.md"

[dependencies]
tokio-util = { version = "0.7.16", features = ["io"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9.2"
bollard = "0.19.1"
anyhow = "1.0"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
thiserror = "2.0"
uuid = { version = "1.0", features = ["serde", "v4"] }
clap = { version = "4.5.16", features = ["derive"] }
colored = "2.1.0"
tar = "0.4"
tempfile = "3.23.0"
futures-util = "0.3.31"
tracing = "0.1" # 核心 tracing
semver = "1"
