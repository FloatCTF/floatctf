[tools]
node = "26.5.1"
pnpm = "11.20.0"
python = "3"
rust = "1.97.1"
"cargo:watchexec-cli" = "2.7.2"

[env]
PROJECT_ROOT = "{{config_root}}"
FLOATCTF_CONFIG = "{{config_root}}/apps/api/config/development.toml"

# 新开发机一次性初始化：工具链 + 项目依赖 + Docker/WireGuard/nftables + helper。
[tasks.setup]
description = "初始化完整 FloatCTF 开发宿主"
run = "./scripts/setup-dev.sh"

# 初始化依赖
[tasks.install]
description = "安装项目依赖"
run = [
    "pnpm install",
    "cargo fetch"
]

# 基础设施
[tasks."infra:up"]
description = "启动 PostgreSQL、RustFS 和 Caddy"
run = "./scripts/infra-up.sh"

[tasks."infra:down"]
description = "停止开发基础设施"
run = """
docker compose \
  -f "$PROJECT_ROOT/infra/compose/compose.dev.yml" \
  down
"""

[tasks."infra:restart"]
description = "重启开发基础设施"
run = [
  { task = "infra:down" },
  { task = "infra:up" },
]

[tasks."infra:reset"]
description = "重置开发基础设施"
run = [
  """docker compose \
    -f "$PROJECT_ROOT/infra/compose/compose.dev.yml" \
    down -v""",
  { task = "infra:up" },
]


[tasks."infra:logs"]
description = "查看基础设施日志"
run = """
docker compose \
  -f "$PROJECT_ROOT/infra/compose/compose.dev.yml" \
  logs -f
"""

# 后端
[tasks."dev:api"]
description = "启动 API 开发服务器并在 Rust/TOML 修改后自动重启（API 进程丢弃 docker 组）"
run = """
watchexec --restart --exts rs,toml \
  --watch apps/api \
  --watch crates/fcmc \
  --watch crates/helper-protocol \
  -- ./scripts/dev-api-run.sh
"""

# 前端
# 开发模式：先构建 workspace 包（frontend-runtime / sdk / react 的 dist 是前端
# 解析 `@floatctf/*` 的真实产物），再启动 Default Frontend 的 Vite（HMR）。
# 生产模式完全不经过这里：apps/web bootstrap → Caddy → 已安装的版本化制品。
[tasks."dev:web"]
description = "构建 workspace 包并启动 Default Frontend 开发服务器（Vite HMR）"
run = """
pnpm run build:packages
pnpm --filter @floatctf/frontend-default dev
"""

# 只在开发 workspace 包本身时用：tsc --watch 持续刷新 packages/*/dist。
[tasks."dev:packages"]
description = "以 watch 模式重建 workspace 包（改动 packages/* 时用）"
run = "pnpm run dev:packages"

# Web 类型检查（与 CI 的 `vite build && tsc` 对齐；biome lint 抓不到类型错误）
[tasks."web:typecheck"]
description = "Web TypeScript 类型检查（全部 web 包 tsc --noEmit）"
# 先构建 packages/*：前端通过 package.json exports 解析 @floatctf/* 到各包的 dist，
# 因此必须先有**当前**的 dist，否则会拿旧 .d.ts 做类型检查（会出现"本地看绿、CI 变红"
# 这类与源码无关的假结果）。
run = """
pnpm run build:packages
pnpm --filter @floatctf/frontend-runtime exec tsc -p tsconfig.build.json --noEmit
pnpm --filter @floatctf/sdk exec tsc -p tsconfig.build.json --noEmit
pnpm --filter @floatctf/react exec tsc -p tsconfig.build.json --noEmit
pnpm --filter @floatctf/web exec tsc --noEmit
pnpm --filter @floatctf/frontend-default exec tsc --noEmit
"""

# 前端平台架构边界守卫（SDK 必须框架无关、默认前端不得逃出自身包、bootstrap 不得
# 带上默认前端……见 docs/frontend/ARCHITECTURE.md）。
[tasks."web:architecture"]
description = "校验可插拔前端架构边界与契约版本一致性"
run = "./scripts/check-architecture.sh"

# 静态检查
[tasks.lint]
description = "执行 Rust 和 Web 静态检查"
run = [
    "cargo clippy --workspace --all-targets --all-features",
    "pnpm --filter @floatctf/frontend-runtime lint",
    "pnpm --filter @floatctf/sdk lint",
    "pnpm --filter @floatctf/react lint",
    "pnpm --filter @floatctf/web lint",
    "pnpm --filter @floatctf/frontend-default lint",
    { task = "web:typecheck" },
    { task = "web:architecture" },
]

# 测试
[tasks.test]
description = "执行 Rust 和 Web 测试"
run = [
    "./scripts/test-rust.sh",
    # 同上：测试同样通过 exports → dist 解析 @floatctf/*，先确保 dist 是当前的。
    "pnpm run build:packages",
    "pnpm run test:web",
]

# 构建
[tasks.build]
description = "构建 API、workspace 包、bootstrap 与 Default Frontend"
run = [
    "cargo build --workspace --release",
    "pnpm run build:packages",
    "pnpm run build:web",
]

# 唯一开发入口：基础设施 healthy → migrations → API watch + Vite。
[tasks.dev]
description = "启动完整 FloatCTF 开发环境（含 AWD 控制面）"
depends = ["infra:up"]
run = "./scripts/dev.sh"

[tasks."dev:down"]
description = "停止开发基础设施（helper 作为宿主控制面保持运行）"
run = [
  { task = "infra:down" },
]

[tasks."dev:reset"]
description = "清空开发数据、重建基础设施并重新应用 migrations"
run = [
  { task = "infra:reset" },
  { task = "db:migration:apply" },
]

[tasks."dev:logs"]
description = "查看开发基础设施日志"
run = [
  { task = "infra:logs" },
]

# Rust 格式检查
[tasks.fmt]
description = "检查 Rust 格式"
run = "cargo fmt --all -- --check"

# 检查
[tasks.check]
description = "检查整个项目"
depends = ["fmt", "lint", "test"]

[tasks."db:migration:new"]
description = "创建新的数据库 migration"
run = """
{{config_root}}/apps/api/src/sql/migrate.sh new "$@"
"""

[tasks."db:migration:list"]
description = "列出数据库 migrations"
run = "{{config_root}}/apps/api/src/sql/migrate.sh list"

[tasks."db:migration:validate"]
description = "校验数据库 migrations（不连接数据库）"
run = "{{config_root}}/apps/api/src/sql/migrate.sh validate"

[tasks."db:migration:status"]
description = "查看数据库 migration 状态（read-only）"
run = "{{config_root}}/apps/api/src/sql/migrate.sh status"

[tasks."db:migration:verify"]
description = "校验数据库 migration 历史"
run = "{{config_root}}/apps/api/src/sql/migrate.sh verify"

[tasks."db:migration:apply"]
description = "执行未应用的数据库 migrations"
run = "{{config_root}}/apps/api/src/sql/migrate.sh apply"

[tasks."db:migration:merge"]
description = "合并数据库 migrations 为 merged.sql"
run = "{{config_root}}/apps/api/src/sql/migrate.sh make"

[tasks."db:gen:rs"]
description = "根据数据库 Schema 生成 SeaORM Rust Entity"
run = "python {{config_root}}/scripts/gen_entities.py"

[tasks."db:gen:ts"]
description = "根据现有 SeaORM Entity 生成 Web TypeScript 类型"
run = "python {{config_root}}/scripts/gen_web_types.py"

[tasks."db:gen"]
description = "生成全部数据库模型代码"
run = [
  { task = "db:gen:rs" },
  { task = "db:gen:ts" },
]
