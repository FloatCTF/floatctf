[package]
name = "floatctf-helper"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
anyhow = "1"
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "client", "server"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
hyperlocal = "0.9"
ipnet = "2"
helper-protocol = { path = "../helper-protocol" }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "net", "process", "rt-multi-thread", "io-util", "fs", "signal"] }
