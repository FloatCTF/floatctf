name = "test-g"
version = "1.0.3"
author = "your_email"
category = "web"
difficulty = "unknown"
tags = ["web"]
description = "hello floatctf"
# optional: 显式 safe_name；缺省由目录 ID 派生
# safe_name = "test-g"

[docker]
port = 80

[docker.recommended_resources]
cpu_millis = 1000
memory_bytes = 536870912
pids_limit = 100

[gamebox]
username = "floatctf"

[[gamebox.healthchecks]]
type = "http"
port = 80
path = "/"
expected_status = 200

[judge]
check_script = "judge/check.py"

# optional: awdp
[awdp]
# zip file from docker image and provide the path to user
source_code_dir = "/var/www/html"
exploit_script = "awdp/exploit.py"
