# apps/api/config/development.toml
[application]
main_url = "http://localhost:9090"

[server]
listen_ip = "0.0.0.0"
listen_port = 9090
work_dir = "../../app"

# 平台出网代理：只作用于平台**主动访问互联网**的请求（如 platform.training.sync 下载
# GitHub Release 制品）；数据库/Redis/RustFS/容器内网一律直连。
# 这里只是 seed 默认值，运行期以管理端可改的设置 OUTBOUND_PROXY 为准。
# 该设置为空时，回落到标准代理环境变量（HTTPS_PROXY / HTTP_PROXY / ALL_PROXY），
# 都没有才直连——本机就需要走代理才能访问 GitHub。
# [proxy]
# url = "http://127.0.0.1:7890"

[auth]
# Change this value in production. It must be at least 16 characters.
jwt_secret = "floatctf-development-secret-change-me"
# 与 JWT 主密钥解耦的派生根（可选；缺省会回落 jwt_secret 并在启动时告警）。
# 开发库用固定值即可，方便复现；生产由 installer 生成独立随机值。
awd_root_key = "floatctf-dev-awd-root-key-change-me"
internal_token_key = "floatctf-dev-internal-token-key-change"

[docker]
socket_path = "/run/floatctf/helper-docker.sock"

[database]
url = "postgres://postgres:postgres@127.0.0.1:5432/floatctf_db"

[logging]
filter = "actix_server=info,floatctf=info,fcmc=info"
timezone = "Asia/Shanghai"

# 题目默认值已内置为静态 seed（EVENT_SCORE_DECAY=500、INSTANCE_DESTROY_DELAY=60、NODE_IP=127.0.0.1 等），
# 运行时通过 settings 表动态调整，无需在配置文件中声明。

[rustfs]
region = "cn-east-1"
endpoint_url = "http://127.0.0.1:9000"
access_key_id = "rustfsadmin"
secret_access_key="rustfsadmin"

[features]
web_terminal = true
unsafe_sql_admin = true

[awd]
network_runtime = "helper"
flagserver_image = "floatctf/awd-flagserver:latest"
judgeserver_image = "floatctf/awd-judgeserver:latest"
# 原生开发 API 不加入 platform control network；这里只提供 scheme+port，部署时 host
# 会替换为各赛事 infra bridge gateway，从容器侧回调宿主 API。
platform_internal_url = "http://127.0.0.1:9090"

[awdp]
# AWDP 练习 JudgeServer：部署到练习专用 docker 子网（fctf-awdp-practice）。
# platform_internal_url 是 JudgeServer 容器回推平台使用的基址（容器视角）。
practice_judgeserver_image = "floatctf/infra/awdp-judgeserver:latest"
practice_network_subnet = "10.42.2.0/23"
practice_judge_ip = "10.42.2.2"
# 比赛赛事独立网络：每个 AWDP Event 从 network_pool 分配一个 /event_netmask 子网。
network_pool = "10.43.0.0/16"
event_netmask = 24
platform_internal_url = "http://10.42.2.128:9090"  # 宿主 API（data 网络网关；host firewall 限制 GameBox 访问）

# GameBox package import / image pipeline.
# push = false → LocalOnly：本地 build+inspect 后以 image_id 为 pin，不要求 registry。
[registry]
image_prefix = "floatctf"
push = false
# username = ""
# password = ""
# server_address = ""
build_timeout_secs = 600

[redis]
# Redis 是 API 必需基础设施：realtime / 限流 / terminal ticket / scheduler wake / settings cache 共用。
url = "redis://127.0.0.1:6379/"

[realtime]
channel = "floatctf:realtime"

# OpenID Connect Provider（FloatCTF 作为通用 OIDC 身份提供方）。默认关闭；
# 设计与运维见 docs/identity/ADR-oidc-provider.md、docs/identity/oidc-operations.md。
# 本地开启步骤：
#   1. scripts/oidc-keygen.sh app/secrets/oidc dev-key-1      # /app 已被 gitignore
#   2. 取消下面注释；issuer 必须与浏览器访问的 origin 完全一致（开发 Caddy 为 :7780）
# [oidc]
# enabled = true
# issuer = "http://localhost:7780"
# allow_loopback_redirect_uris = true    # 允许 http://127.0.0.1 / localhost 回调（仅开发）
# require_client_approval = true
# account_chooser = true                 # prompt=select_account 显示账号选择页；false 仅为临时回滚
# [[oidc.signing_keys]]
# kid = "dev-key-1"
# private_key_file = "../../../app/secrets/oidc/dev-key-1.pem"   # 相对本文件所在目录
# active = true

# ── 前端市场（GET /api/admin/frontend-market）─────────────────────────────────
# 只做**发现**：列出 GitHub 上候选前端仓库及其 release 里的预构建制品元数据。
# 安装不在这里 —— 安装由宿主的 `frontend.sh install <制品.tar.gz>` 负责，
# 因为生产里 API 容器是 read_only + cap_drop=ALL，根本没有挂载前端目录。
#
# 整段可以省略，省略时用下面的默认值。
[frontend_market]
owner = "FloatCTF"
name_prefix = "floatctf-frontend-"
# 可选。不配也能用，但未认证的 GitHub API 限流是 60 次/小时/IP，
# 而刷新一次市场要打 1 + N(+N) 次请求（N = 候选仓库数）。配了能显著抬高上限，
# 并能看到私有仓库。它是密钥，用 Secret 包装，不会进日志。
# token = "ghp_xxx"
# 发现结果的缓存秒数；TTL 内重复查询零请求。
cache_ttl_secs = 300
