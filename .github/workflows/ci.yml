name: CI

on:
  push:
    branches: [awd, main, master]
  pull_request:
    branches: [awd, main, master]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# 三层分层（CI-fast / CI-docker / CI-host-network，见下）：
#   CI-fast（PR 必跑）        —— 单测 + mock + 架构/安全 grep
#   CI-docker（PR 或 on-demand）—— Docker E2E（Flag/Judge smoke + 场景 A/B/C/G/H）
#   CI-host-network（手动触发）—— root + nftables/WG 系统级场景 D/E/F/I
jobs:
  fast-rust:
    name: CI-fast · Rust unit + security grep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # 注意：`cargo fmt --all` 是「写入模式」，即使有格式违规也退出 0（只是静默改写文件），
      # 因此它不是门禁；必须用 `-- --check` 才会在违规时非零退出。
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features
      - run: cargo test --workspace --lib
      # 集成测试（apps/api/tests/ 下 44 个独立 crate target）不在 `--lib` 范围内，它们只在
      # CI-docker 任务里真正执行。这里强制它们至少**编译通过**：PR 全绿不该掩盖「共享
      # helper / 契约目录改坏导致集成测试编译失败」这类问题。
      - run: cargo test --workspace --tests --no-run
      - name: Security architecture grep (P5-12)
        run: |
          # 两个坑，都曾让守卫失真：
          #  1) grep 对不存在的路径返回 2，直接放进 `if` 会「静默放行」→ 先断言路径存在；
          #  2) 注释里「提到」禁止项也会命中 → 只检查非注释行，并限定 *.rs
          #     （apps/api/src/sql/ 下是冻结的 migrations，不该被这些守卫约束）。
          for p in apps/api/src/bootstrap apps/api/src apps/api/src/modules/event/awd apps/api/src/modules/event/awdp; do
            [ -d "$p" ] || { echo "FAIL: $p missing (path drifted; guard would silently pass)"; exit 1; }
          done
          # 过滤掉 Rust 注释行：`//`、`/*`、块注释续行 `* `、结束行 `*/`。
          # 注意用 `\*[[:space:]]` 而非裸 `\*`，否则会误滤以解引用开头的真实代码行（`*ptr = ..`）。
          code_only() { grep -vE ':[0-9]+:[[:space:]]*(//|/\*|\*[[:space:]]|\*/)'; }
          if grep -rn --include='*.rs' 'vec!\[0u8; 32\]' apps/api/src/bootstrap | code_only; then
            echo "FAIL: zero-key fallback"; exit 1
          fi
          if grep -rn --include='*.rs' 'nft flush ruleset' apps/api/src | code_only; then
            echo "FAIL: nft flush ruleset forbidden"; exit 1
          fi
          for d in apps/api/src/modules/event/awd apps/api/src/modules/event/awdp; do
            if grep -rn --include='*.rs' 'sh -c' "$d" | code_only; then
              echo "FAIL: shell concat forbidden in $d"; exit 1
            fi
          done
          echo "security greps OK"

  fast-web:
    name: CI-fast · Web checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 26.5.1
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # 先构建 workspace 包：前端按 package.json exports 解析 @floatctf/*，
      # 类型检查与构建都依赖 packages/*/dist 存在。
      - run: pnpm run build:packages
      # 架构边界 + 契约版本一致性（SDK 必须框架无关；bootstrap 不得带上默认前端……）
      - run: ./scripts/check-architecture.sh
      - run: pnpm --filter @floatctf/frontend-runtime lint
      - run: pnpm --filter @floatctf/sdk lint
      - run: pnpm --filter @floatctf/react lint
      - run: pnpm --filter @floatctf/web lint
      - run: pnpm --filter @floatctf/frontend-default lint
      - run: pnpm run test:web
      - run: pnpm run build:web
      # 发布形态验证：打包 web-dist 并断言布局/manifest/脚本语法（与 release 同一脚本）。
      - run: ./scripts/package-web-dist.sh /tmp/web-dist.tar.gz
      - run: ./scripts/verify-release-frontend.sh /tmp/web-dist.tar.gz
      # 前端管理器契约 / 安全负向测试（manifest 校验、注册表数据边界、制品树安全、
      # 版本不可变、显式指针、构建身份非 root）。不依赖 docker。
      - run: ./scripts/test-frontend-manager.sh
      # 发布工作流静态/行为契约：tag 才允许发布、dispatch 默认不发布、制品清单与
      # SHA256SUMS 覆盖、ops-tools 成员白名单与确定性、rc.yml 非发布语义。
      - run: ./scripts/test-release-workflow.sh
      # 安装器 / 升级器契约：新 flag、ops-tools 装配、apply_migrations 的 fresh 跳过、
      # 卸载活跃运行时守卫，以及**内嵌 uninstall.sh 的 bash -n**（此前无任何语法门禁）。
      - run: ./scripts/test-installer-contract.sh
      # SDK 分发包：打包 → 校验 → 外部全新工程消费（npm 安装 + tsc + node 运行）。
      # registry 不可达时自动 SKIP 联网部分并仍校验 tarball。
      - run: ./scripts/test-sdk-dist.sh
      # 运行时镜像分发契约：GHCR 只在 tag 发布路径构建+推送、OCI 标签齐全、
      # rc/分支/手工非发布路径绝不推送、--push 非默认（stub-docker 行为验证）。
      - run: ./scripts/test-runtime-images.sh
      # RustFS 就绪契约：镜像就绪探测 + API 有界重试（延迟就绪不产生 crash-loop）。
      # 需要 docker；不可用时脚本自行 SKIP 并说明原因。
      - run: ./scripts/test-rustfs-readiness.sh

  docker-e2e:
    name: CI-docker · AWD infra smoke (on-demand)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'docker-e2e')
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: floatctf_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # 这里才是集成测试（apps/api/tests/）真正执行的作业：无 live API 时它们自行 soft-skip，
      # 需要行为级验证时在 PR 上打 `docker-e2e` 标签或手动 dispatch。
      - run: cargo test --workspace
      - name: Flag/Judge smoke（真构建 bookworm 二进制 + 起容器 + /health）
        run: ./apps/api/scripts/e2e_flag_judge.sh
        env:
          RUN_DOCKER_TESTS: "1"

  host-network:
    name: CI-host-network · nftables/WG scenarios (nightly)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: nftables prototype gate (P1-0, needs CAP_NET_ADMIN)
        run: sudo -E apps/api/scripts/nft_prototype.sh
      - name: cargo unit (host)
        run: cargo test --workspace
