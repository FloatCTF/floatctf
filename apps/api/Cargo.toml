[package]
name = "floatctf"
version = "0.3.2"
edition.workspace = true

[features]
default = []
# Optional multi-node realtime fan-out via Redis pub/sub (REALTIME_REDIS_URL).
realtime-redis = ["dep:redis"]

[dependencies]
fcmc = { path = "../../crates/fcmc" }
# Optional: enable with `--features realtime-redis` for multi-node SSE fan-out.
redis = { version = "0.27", optional = true, default-features = false, features = [
  "tokio-comp",
  "aio",
] }

actix-cors = "0.7.1"
actix-multipart = "0.7.2"
actix-web = "4"
actix-ws = "0.3"
anyhow = "1"
argon2 = "0.5"
async-trait = "0.1.89"
aws-config = { version = "1.1.7", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1.129.0"
base64 = "0.22.1"
bollard = "0.19.1"
chacha20poly1305 = "0.10"
hex = "0.4"
hkdf = "0.12"
hmac = "0.12"
rand = "0.8"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
cron = "0.12"
futures-util = "0.3.31"
jsonwebtoken = "9.3.1"
lettre = { version = "0.11.19", default-features = false, features = [
  "tokio1-rustls-tls",
  "smtp-transport",
  "builder"
] }
minijinja = "2.12.0"
pnet = "0.35.0"
sea-orm = { version = "1", features = [
  "macros",
  "runtime-tokio-rustls",
  "sqlx-postgres",
  "with-chrono",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.37.0"
tempfile = "3.20.0"
thiserror = "2"
toml = "0.9.5"
# logging
tracing = "0.1"  # 核心 tracing
tracing-actix-web = "0.7.19"  # Actix Web 的 TracingLogger middleware
tracing-appender = "0.2"  # 支持日志写入文件
tracing-subscriber = { version = "0.3", features = [
  "chrono",
  "env-filter",
  "fmt",
] }
uuid = { version = "1.0", features = ["serde", "v4"] }
zip = "4.3.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["fs", "time"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["serde", "v4"] }
