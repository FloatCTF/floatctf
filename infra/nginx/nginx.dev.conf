user nginx;
worker_processes auto;
worker_rlimit_nofile 100000;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    charset utf-8;

    # Docker 内置 DNS。
    # 使用变量形式的 proxy_pass 时，允许后端容器重建后重新解析 IP。
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    # 日志直接输出给 Docker，使用 docker compose logs 查看。
    log_format main
        '$remote_addr - $remote_user [$time_local] '
        '"$request" $status $body_bytes_sent '
        '"$http_referer" "$http_user_agent" '
        'upstream="$upstream_addr" '
        'request_time=$request_time '
        'upstream_time=$upstream_response_time';

    access_log /dev/stdout main;
    error_log /dev/stderr info;

    # 基础性能设置
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    keepalive_timeout 65s;
    keepalive_requests 10000;

    reset_timedout_connection on;
    server_tokens off;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;

    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/wasm
        image/svg+xml;

    server {
        listen 80;
        listen [::]:80;

        server_name _;

        # 当前设为无限制。开发环境可以使用；
        # 生产环境建议设成明确上限，例如 512m。
        client_max_body_size 0;
        client_body_buffer_size 1m;

        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        proxy_buffering off;
        proxy_request_buffering off;

        # ------------------------------------------------------------
        # API
        #
        # 不带尾部斜杠的 proxy_pass 会保留原始 URI：
        # /api/users -> dev:9090/api/users
        # ------------------------------------------------------------
        location ^~ /api/ {
            set $api_backend http://host.docker.internal:9090;

            proxy_pass $api_backend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;

            proxy_cache_bypass $http_upgrade;
        }

        # ------------------------------------------------------------
        # RustFS 公共桶
        #
        # /public/a.png
        # -> /floatctf-public/a.png
        # ------------------------------------------------------------
        location ^~ /public/ {
            set $rustfs_backend http://rustfs:9000;

            rewrite ^/public/(.*)$ /floatctf-public/$1 break;
            proxy_pass $rustfs_backend;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;

            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ------------------------------------------------------------
        # RustFS 私有桶
        #
        # 注意：这里只是路径代理，本身没有鉴权。
        # 私有资源权限必须由 API、签名 URL 或 RustFS 权限策略保证。
        # ------------------------------------------------------------
        location ^~ /private/ {
            set $rustfs_backend http://rustfs:9000;

            rewrite ^/private/(.*)$ /floatctf-private/$1 break;
            proxy_pass $rustfs_backend;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;

            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ------------------------------------------------------------
        # 挑战附件下载
        #
        # /static/challenges/<challenge>/attachment/<file>
        # -> /app/api/challenges/<challenge>/attachment/<file>
        # ------------------------------------------------------------
        location ~ ^/static/challenges/([^/]+)/attachment/(.+)$ {
            alias /app/api/challenges/$1/attachment/$2;

            try_files $uri =404;

            add_header X-Content-Type-Options nosniff always;
            add_header Content-Disposition 'attachment' always;
        }

        # ------------------------------------------------------------
        # 前端开发服务器
        #
        # 必须放在最后，作为兜底路由。
        # ------------------------------------------------------------
        location / {
            set $web_backend http://host.docker.internal:3000;

            proxy_pass $web_backend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;

            proxy_cache_bypass $http_upgrade;
        }
    }
}
