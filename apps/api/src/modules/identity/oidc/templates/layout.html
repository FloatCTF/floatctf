<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="same-origin">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex, nofollow">
<title>{% block title %}FloatCTF{% endblock %} · FloatCTF 账号</title>
<link rel="icon" href="/oauth/assets/float.png">
<link rel="stylesheet" href="/oauth/assets/ui.css">
<script src="/oauth/assets/ui.js" defer></script>
</head>
<body>
<main class="shell">
  <div class="brand">
    <span class="logo"><img src="/oauth/assets/float.png" alt="" width="30" height="30" data-fallback><span class="logo-fallback" aria-hidden="true">F</span></span>
    <span>FloatCTF 账号</span>
  </div>
  <section class="card">
{% block content %}{% endblock %}
  </section>
  <p class="footer">{% block footer %}使用 FloatCTF 账号登录第三方应用 · OpenID Connect{% endblock %}</p>
</main>
</body>
</html>
