[package]
name = "floatctf-migration"
version = "0.1.0"
edition = "2024"
publish = false
description = "Schema migrations for FloatCTF (base + AWD SQL as source of truth)"

[lib]
name = "floatctf_migration"
path = "src/lib.rs"

[[bin]]
name = "floatctf-migration"
path = "src/main.rs"

[dependencies]
async-std = { version = "1", features = ["attributes", "tokio1"] }
clap = { version = "4", features = ["derive", "env"] }
sea-orm-migration = { version = "1", features = ["runtime-async-std-rustls", "sqlx-postgres"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
