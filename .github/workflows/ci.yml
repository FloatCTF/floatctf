name: CI

on:
  push:
    branches: [awd, main, master]
  pull_request:
    branches: [awd, main, master]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# 三层分层（CI-fast / CI-docker / CI-host-network，见下）：
#   CI-fast（PR 必跑）        —— 单测 + mock + 架构/安全 grep
#   CI-docker（PR 或 on-demand）—— Docker E2E（Flag/Judge smoke + 场景 A/B/C/G/H）
#   CI-host-network（手动触发）—— root + nftables/WG 系统级场景 D/E/F/I
jobs:
  fast-rust:
    name: CI-fast · Rust unit + security grep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # 注意：`cargo fmt --all` 是「写入模式」，即使有格式违规也退出 0（只是静默改写文件），
      # 因此它不是门禁；必须用 `-- --check` 才会在违规时非零退出。
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features
      - run: cargo test --workspace --lib
      - name: Security architecture grep (P5-12)
        run: |
          # 两个坑，都曾让守卫失真：
          #  1) grep 对不存在的路径返回 2，直接放进 `if` 会「静默放行」→ 先断言路径存在；
          #  2) 注释里「提到」禁止项也会命中 → 只检查非注释行，并限定 *.rs
          #     （apps/api/src/sql/ 下是冻结的 migrations，不该被这些守卫约束）。
          for p in apps/api/src/bootstrap apps/api/src apps/api/src/modules/event/awd apps/api/src/modules/event/awdp; do
            [ -d "$p" ] || { echo "FAIL: $p missing (path drifted; guard would silently pass)"; exit 1; }
          done
          # 过滤掉 Rust 注释行：`//`、`/*`、块注释续行 `* `、结束行 `*/`。
          # 注意用 `\*[[:space:]]` 而非裸 `\*`，否则会误滤以解引用开头的真实代码行（`*ptr = ..`）。
          code_only() { grep -vE ':[0-9]+:[[:space:]]*(//|/\*|\*[[:space:]]|\*/)'; }
          if grep -rn --include='*.rs' 'vec!\[0u8; 32\]' apps/api/src/bootstrap | code_only; then
            echo "FAIL: zero-key fallback"; exit 1
          fi
          if grep -rn --include='*.rs' 'nft flush ruleset' apps/api/src | code_only; then
            echo "FAIL: nft flush ruleset forbidden"; exit 1
          fi
          for d in apps/api/src/modules/event/awd apps/api/src/modules/event/awdp; do
            if grep -rn --include='*.rs' 'sh -c' "$d" | code_only; then
              echo "FAIL: shell concat forbidden in $d"; exit 1
            fi
          done
          echo "security greps OK"

  fast-web:
    name: CI-fast · Web checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 26.5.1
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @floatctf/web lint
      - run: pnpm --filter @floatctf/web test
      - run: pnpm --filter @floatctf/web build

  docker-e2e:
    name: CI-docker · AWD infra smoke (on-demand)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'docker-e2e')
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: floatctf_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - name: Flag/Judge smoke (env-gated, skips when Dockerfiles missing)
        run: ./apps/api/scripts/e2e_flag_judge.sh
        env:
          RUN_DOCKER_TESTS: "1"

  host-network:
    name: CI-host-network · nftables/WG scenarios (nightly)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: nftables prototype gate (P1-0, needs CAP_NET_ADMIN)
        run: sudo -E apps/api/scripts/nft_prototype.sh
      - name: cargo unit (host)
        run: cargo test --workspace
