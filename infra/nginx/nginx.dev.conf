user nginx;
worker_processes auto;
worker_rlimit_nofile 100000;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    charset utf-8;

    # Docker 内置 DNS。
    # 仅 rustfs 仍使用变量形式 proxy_pass，需要运行时解析服务名。
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # 静态 upstream：启动/重载时用系统解析（含 /etc/hosts）。
    # host.docker.internal 由 compose extra_hosts 映射到宿主网关 172.17.0.1，
    # 因此不能用 Docker 内嵌 DNS（127.0.0.11 不服务 extra_hosts 条目），
    # 改用静态 upstream 让 nginx 读 /etc/hosts 解析。
    # keepalive：复用到后端的连接，避免每个模块请求（dev 下 150+）都新建 TCP。
    upstream api_backend {
        server host.docker.internal:9090;
        keepalive 64;
    }

    upstream web_backend {
        server host.docker.internal:3000;
        keepalive 64;
    }

    # WebSocket 升级：有 Upgrade 头转发 upgrade，否则不发送 Connection 头
    # （空值会被 nginx 丢弃），使普通 HTTP 请求能复用后端 keepalive 连接。
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      "";
    }

    # 日志直接输出给 Docker，使用 docker compose logs 查看。
    log_format main
        '$remote_addr - $remote_user [$time_local] '
        '"$request" $status $body_bytes_sent '
        '"$http_referer" "$http_user_agent" '
        'upstream="$upstream_addr" '
        'request_time=$request_time '
        'upstream_time=$upstream_response_time';

    access_log /dev/stdout main;
    error_log /dev/stderr info;

    # 基础性能设置
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    keepalive_timeout 65s;
    keepalive_requests 10000;

    reset_timedout_connection on;
    server_tokens off;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;

    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/wasm
        image/svg+xml;

    server {
        listen 80;
        listen [::]:80;

        server_name _;

        # 当前设为无限制。开发环境可以使用；
        # 生产环境建议设成明确上限，例如 512m。
        client_max_body_size 0;
        client_body_buffer_size 1m;

        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        proxy_buffering off;
        proxy_request_buffering off;

        # ------------------------------------------------------------
        # API
        #
        # 不带尾部斜杠的 proxy_pass 会保留原始 URI：
        # /api/users -> dev:9090/api/users
        # ------------------------------------------------------------
        location ^~ /api/ {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;

            proxy_cache_bypass $http_upgrade;
        }

        # ------------------------------------------------------------
        # RustFS 公共桶
        #
        # /public/a.png
        # -> /floatctf-public/a.png
        # ------------------------------------------------------------
        location ^~ /public/ {
            set $rustfs_backend http://rustfs:9000;

            rewrite ^/public/(.*)$ /floatctf-public/$1 break;
            proxy_pass $rustfs_backend;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;

            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ------------------------------------------------------------
        # RustFS 私有桶
        #
        # 注意：这里只是路径代理，本身没有鉴权。
        # 私有资源权限必须由 API、签名 URL 或 RustFS 权限策略保证。
        #
        # Host 必须固定为 RustFS 的 endpoint host（与 API 端 aws-sdk 生成
        # SigV4 presigned URL 时的签名 host 一致，见 [rustfs].endpoint_url）：
        #   /private/<key>?X-Amz-...
        #     -> /floatctf-private/<key>?X-Amz-...
        #     Host: 127.0.0.1:9000
        # RustFS 按 SDK 原始 canonical request（host=127.0.0.1:9000）验签，
        # 因此不能用 $http_host（浏览器地址）转发，否则验签失败返回 403。
        # ------------------------------------------------------------
        location ^~ /private/ {
            set $rustfs_backend http://rustfs:9000;

            rewrite ^/private/(.*)$ /floatctf-private/$1 break;
            proxy_pass $rustfs_backend;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host 127.0.0.1:9000;

            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ------------------------------------------------------------
        # 挑战附件下载
        #
        # /static/challenges/<challenge>/attachment/<file>
        # -> /app/api/challenges/<challenge>/attachment/<file>
        # ------------------------------------------------------------
        location ~ ^/static/challenges/([^/]+)/attachment/(.+)$ {
            alias /app/api/challenges/$1/attachment/$2;

            try_files $uri =404;

            add_header X-Content-Type-Options nosniff always;
            add_header Content-Disposition 'attachment' always;
        }

        # ------------------------------------------------------------
        # 前端开发服务器
        #
        # 必须放在最后，作为兜底路由。
        # ------------------------------------------------------------
        location / {
            proxy_pass http://web_backend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;

            proxy_cache_bypass $http_upgrade;
        }
    }
}
