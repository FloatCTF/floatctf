name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build release artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ── 前端 ──
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 26.5.1
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @floatctf/web build

      # ── 后端（全 workspace 二进制）──
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --release

      # ── 发布 3 个产物（供 install.sh 下载部署）──
      #   1. floatctf            API 二进制（bin/floatctf）
      #   2. web-dist.tar.gz     前端静态产物
      #   3. merged.sql          单个 SQL（fresh-DB bootstrap）
      - name: Assemble release artifacts
        shell: bash
        run: |
          set -euo pipefail

          # 1) API 二进制
          install -m 0755 target/release/floatctf floatctf

          # 2) 前端静态产物
          tar -czf web-dist.tar.gz -C apps/web/dist .

          # 3) merged.sql（确定性 fresh-DB bootstrap）
          bash apps/api/src/sql/migrate.sh make
          install -m 0644 apps/api/src/sql/merged.sql merged.sql

          echo "release artifacts:"
          ls -la floatctf web-dist.tar.gz merged.sql

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            floatctf
            web-dist.tar.gz
            merged.sql
          generate_release_notes: true
